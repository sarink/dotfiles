# use bash
set-option -g default-shell "/bin/zsh"

# change prefix from C-b to C-a
unbind C-b
set -g prefix C-a
# and use C-a a to send commands to a tmux in a tmux
bind C-a send-prefix

# Vi-style key bindings for stuff like copy+paste
set -g status-keys vi
set-window-option -g mode-keys vi

# Wrap tmux-buffer pastes in bracketed-paste markers so vim doesn't re-indent them
bind ] paste-buffer -p

# Send every tmux copy (drag, double/triple-click, y, Enter) to the macOS clipboard
set -s copy-command 'pbcopy'
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Enable mouse scrolling
setw -g mouse on

# Vi-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix-free pane switching with Alt+hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Prefix-free window switching with Alt+1-9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Open new panes/windows in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# For colors, especially in vim
set -g default-terminal "screen-256color" 

# Window & pane numbering should start at 1 for the sake of fingers
set -g base-index 1
set-window-option -g pane-base-index 1

# Tweak status bar to make a little less blinding
# set -g status-bg black
# set -g status-fg white
# set-window-option -g window-status-current-bg white
# set-window-option -g window-status-current-fg black

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic save/restore via tmux-continuum
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
